const LOGO = "logo.png";
document.querySelectorAll("img[data-logo]").forEach(i => i.src = LOGO);
const LOGO_W = "logo-w.png";
document.querySelectorAll('img[data-logo="w"]').forEach(i => i.src = LOGO_W);
const fav = document.createElement("link"); fav.rel = "icon"; fav.href = LOGO; document.head.appendChild(fav);
const $ = (s, r = document) => r.querySelector(s);

function renderWork(t) {
  $("#work-grid").innerHTML = WORK.map((w, i) => `
    <div class="work-card relative w-full aspect-square ${i < 3 ? "border-b md:border-b-0 md:border-r border-cream/10" : ""} overflow-hidden group cursor-pointer">
      <img src="${w.img}" alt="${w.alt}" loading="lazy" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-500 group-hover:opacity-0 z-10">
      <video class="absolute inset-0 w-full h-full object-cover opacity-0 group-hover:opacity-60 transition-opacity duration-500 z-0" loop muted playsinline>
        <source src="https://assets.mixkit.co/videos/preview/${w.vid}" type="video/mp4">
      </video>
      <div class="absolute inset-0 p-6 flex flex-col justify-end z-20 transition-all duration-300 md:translate-y-4 group-hover:translate-y-0 opacity-100 md:opacity-0 group-hover:opacity-100 bg-gradient-to-t from-ink/90 via-ink/50 to-transparent text-cream">
        <h3 class="text-xl font-bold leading-tight">${w.name}</h3>
        <p class="text-cream/70 font-semibold mt-2 tracking-wide uppercase text-[10px]">${t.work[i][0]}</p>
        ${t.work[i][1] ? `<p class="text-cream/85 text-xs mt-2 hidden group-hover:block">${t.work[i][1]}</p>` : ""}
      </div>
    </div>`).join("");
  document.querySelectorAll(".work-card").forEach(card => {
    const v = $("video", card);
    card.addEventListener("mouseenter", () => v.play().catch(() => {}));
    card.addEventListener("mouseleave", () => { v.pause(); v.currentTime = 0; });
  });
}

function setLang(lang) {
  const t = I18N[lang] || I18N.tr;
  document.documentElement.lang = lang;
  document.title = t.title;
  $('meta[name="description"]').content = t.desc;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t[el.dataset.i18n];
    if (v.includes("<br>")) el.innerHTML = v; else el.textContent = v;
  });
  $("#svc-list").innerHTML = t.services.map((s, i) => `
    <div class="svc" role="button" tabindex="0" aria-expanded="false">
      <div class="flex items-baseline justify-between gap-4">
        <h3 class="svc-title text-2xl md:text-4xl font-semibold"><span class="text-crimson text-base md:text-lg font-bold mr-4">0${i + 1}</span>${s.t}</h3>
        <span class="svc-plus text-3xl font-light leading-none">+</span>
      </div>
      <div class="svc-body"><div>
        <p class="mt-5 text-cream/75 leading-relaxed max-w-3xl">${s.p}</p>
        <div class="mt-5 flex flex-wrap gap-2">${s.tags.map(x => `<span class="chip">${x}</span>`).join("")}</div>
      </div></div>
    </div>`).join("");
  $("#do-list").innerHTML = t.doing.map((x, i) => `<div class="do-cell"><span class="do-num">${String(i + 1).padStart(2, "0")}</span><span class="do-txt">${x}</span></div>`).join("");
  renderWork(t);
  document.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  try { localStorage.setItem("ds-lang", lang); } catch (e) {}
}

/* Dil seçimi: kayıtlı tercih → tarayıcı dili (tr ise TR, değilse EN). Hep TR açılsın isterseniz 'tr' yazın. */
let saved = null;
try { saved = localStorage.getItem("ds-lang"); } catch (e) {}
setLang(saved || ((navigator.language || "tr").toLowerCase().startsWith("tr") ? "tr" : "en"));
document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* Marquee */
const group = CLIENTS.map(c => `<span class="text-2xl font-semibold mx-12 tracking-wide whitespace-nowrap">${c}</span>`).join("");
$("#marquee").innerHTML = group + group + group + group;
$("#marquee").style.animationDuration = "40s";

/* Hizmetler akordeon */
$("#svc-list").addEventListener("click", e => {
  const row = e.target.closest(".svc"); if (!row) return;
  row.classList.toggle("open"); row.setAttribute("aria-expanded", row.classList.contains("open"));
});
$("#svc-list").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("svc")) { e.preventDefault(); e.target.click(); }
});

/* Preloader */
window.addEventListener("load", () => setTimeout(() => {
  const p = $("#preloader"); p.style.opacity = "0"; p.style.visibility = "hidden";
}, 1500));

/* Menü */
const menu = $("#mobile-menu"), icon = $("#menu-icon"), btn = $("#menu-btn");
function toggleMenu(force) {
  const open = typeof force === "boolean" ? force : !menu.classList.contains("open");
  menu.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", open);
  navState();
  icon.setAttribute("d", open ? "M6 18L18 6M6 6l12 12" : "M4 6h16M4 12h16M4 18h16");
}
btn.addEventListener("click", () => toggleMenu());
menu.querySelectorAll("a").forEach(a => a.addEventListener("click", () => toggleMenu(false)));
document.addEventListener("keydown", e => { if (e.key === "Escape") toggleMenu(false); });

/* Üst menü rengi: hero üzerinde beyaz, sonrasında koyu */
const nav = $("nav");
const darks = document.querySelectorAll("[data-dark]");
function navState() {
  let on = false;
  if (!menu.classList.contains("open")) darks.forEach(d => { const b = d.getBoundingClientRect(); if (b.top <= 40 && b.bottom >= 40) on = true; });
  nav.classList.toggle("on-hero", on);
}
window.addEventListener("scroll", navState, { passive: true });
window.addEventListener("resize", navState);
navState();
</script>
</body>
</html>
